name: CI

on:
  push:
    branches: [main, develop, 'feat/**', 'fix/**', 'codex/**']
  pull_request:
    branches: [main, develop]

env:
  BUILD_TYPE: Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cmake_flags: ""
          - os: macos-latest
            cmake_flags: "-DCMAKE_OSX_ARCHITECTURES=arm64"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libcurl4-openssl-dev libsqlite3-dev

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DMASTER_AGENT_BUILD_TESTS=ON \
            -DMASTER_AGENT_BUILD_CLI=ON \
            ${{ matrix.cmake_flags }}

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} -j$(nproc 2>/dev/null || sysctl -n hw.logicalcpu)

      - name: Test
        working-directory: build
        run: ctest --output-on-failure --timeout 120

      - name: Run all synthetic evaluations
        run: bash eval/run_all.sh

      - name: Verify SDK and CLI archive
        run: bash scripts/package.sh build dist/sparx-sdk.tar.gz

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sparx-sdk-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          retention-days: 7
          if-no-files-found: error

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install analysis dependencies
        run: sudo apt-get update && sudo apt-get install -y clang-tidy libcurl4-openssl-dev libsqlite3-dev
      - name: Configure compilation database
        run: cmake -S . -B build-lint -DBUILD_EVAL=OFF -DCMAKE_BUILD_TYPE=Debug
      - name: Analyze public runtime (blocking)
        run: |
          clang-tidy -p build-lint \
            --checks='-*,clang-analyzer-*,bugprone-use-after-move,bugprone-sizeof-expression' \
            --warnings-as-errors='*' \
            --header-filter='/(core|backends|include/master_agent/runtime|examples/inventory_agent)/' \
            core/reference_runtime.cpp core/durable_store.cpp backends/http_model.cpp \
            cli/src/reference_main.cpp examples/inventory_agent/main.cpp

  sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libcurl4-openssl-dev libsqlite3-dev
      - name: Build with ASan and UBSan
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build-sanitize -DBUILD_EVAL=OFF -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' \
            -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
          cmake --build build-sanitize --parallel 2 --target test_reference_runtime test_execution_context \
            test_durable_runtime durable_probe sparx http_model_probe inventory_agent test_harness
      - name: Runtime, network and recovery sanitizer contracts
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitize --output-on-failure --timeout 90 -R 'test_reference_runtime|test_execution_context|test_durable_runtime|crash_recovery_contract|http_model_contract|inventory_service_contract|test_harness'
      - name: Build and test without optional dependencies
        run: |
          cmake -S . -B build-minimal -DCMAKE_BUILD_TYPE=Release -DBUILD_EVAL=OFF \
            -DMASTER_AGENT_ENABLE_HTTP=OFF -DMASTER_AGENT_ENABLE_STORAGE=OFF
          cmake --build build-minimal --parallel 2
          ctest --test-dir build-minimal --output-on-failure --timeout 90

  security-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify no Qualcomm-licensed files in public tree
        run: |
          echo "Checking for Qualcomm-headered files outside allowed directories..."
          LEAKED=$(grep -rl "Confidential and Proprietary" --include="*.py" . \
            | grep -v "genai_lib/" \
            | grep -v "utilities/" \
            | grep -v "qnn_model_prepare" \
            || true)
          if [ -n "$LEAKED" ]; then
            echo "❌ FATAL: Qualcomm-licensed files found in public tree:"
            echo "$LEAKED"
            exit 1
          fi
          echo "✅ No Qualcomm-licensed files in public tree"

      - name: Check for secrets in committed files
        run: |
          echo "Scanning for potential secrets..."
          SECRETS=$(grep -rn --include="*.yml" --include="*.yaml" --include="*.json" \
            -E "(api_key|secret|password|token)\s*[:=]\s*['\"][^$]" . \
            | grep -v "api_key_env" \
            | grep -v "_ENV" \
            | grep -v "example" \
            || true)
          if [ -n "$SECRETS" ]; then
            echo "⚠️ Potential hardcoded secrets found:"
            echo "$SECRETS"
            exit 1
          fi
          echo "✅ No hardcoded secrets detected"
